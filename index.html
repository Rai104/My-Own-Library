<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Own Library</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Welcome to My Own Library!</h1>
            <p>This is a simple library application where you can keep track of your current reads.</p>
            <div class="book-form">
                <h2>Add a Series</h2>
                <form id="bookForm">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                    <label for="chapter">Current Chapter:</label>
                    <input type="number" id="chapter" min="0" name="chapter" required>
                    <label for="readStatus">Read Status:</label>
                    <select id="readStatus" name="readStatus">
                        <option value="not completed">Not Completed</option>
                        <option value="completed">Completed</option>
                    </select>
                    <button type="submit">Add Selection</button>
                </form>
            </div>
            <div class="series-list">
                <h2>Current Reads</h2>
                <ul id="seriesList"></ul>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
