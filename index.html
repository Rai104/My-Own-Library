<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Own Library</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Account Button / Navigation -->
         <header class="app-header">
            <button id="accountButton"> 👤 My Account</button>
         </header>

         <div class="app-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <button id="navAddBook" class="nav-button">Add a Series</button>
                <button id="navAddShelf" class="nav-button">Add a Bookshelf</button>
                <button id="navViewLibrary" class="nav-button">View Library</button>
                <button id="navDarkMode" class="nav-button">Dark Mode</button>
            </aside>

            <!-- Panel to Slide -->
             <div id="sidePanel">
                <button id="closePanel">Close</button>
                <div id="panelContent"></div>
         </div>

         <!-- Main Content -->
          <main class="main-content">
            <h2 id="viewShelves">Your Bookshelves</h2>
            <div id="displayGrid">
                <div class="shelf-card">
                    <div class="shelf-graphic">📚</div>
                    <p>Novels</p>
                </div>
                <div class="shelf-card">
                    <div class="shelf-graphic">📖</div>
                    <p>Non-Fiction</p>
                </div>
            </div>
